[project]
name = "minirt-python"
version = "1.0.0"
description = "Трассировщик лучей на Python + NumPy по мотивам miniRT школы 42"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pygame-ce>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.mypy]
strict = true
files = ["minirt", "main.py"]

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["minirt"]